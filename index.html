<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samurai Fruit</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:linear-gradient(#6fd3ff,#ffffff);
    font-family:Arial;
}

canvas{
    display:block;
}

#ui{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-size:28px;
    font-weight:bold;
    text-shadow:2px 2px 5px black;
}
</style>
</head>

<body>

<div id="ui">
Skor : <span id="score">0</span><br>
Nyawa : <span id="life">3</span><br>
Level : <span id="level">1</span>
</div>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let score=0;
let life=3;
let level=1;

const fruits=[];

const fruitList=[
{emoji:"🍎",score:10},
{emoji:"🍊",score:15},
{emoji:"🍉",score:20},
{emoji:"🍌",score:15},
{emoji:"🍇",score:25},
{emoji:"🍓",score:30},
{emoji:"🍍",score:35},
{emoji:"🥝",score:40},
{emoji:"💣",score:-1}
];

class Fruit{

constructor(){

let pilih=fruitList[Math.floor(Math.random()*fruitList.length)];

this.emoji=pilih.emoji;
this.value=pilih.score;

this.x=Math.random()*canvas.width;
this.y=canvas.height+50;

this.vx=Math.random()*8-4;
this.vy=-(10+Math.random()*5);

this.gravity=0.18;

this.size=50;

}

draw(){

ctx.font=this.size+"px serif";
ctx.fillText(this.emoji,this.x,this.y);

}

update(){

this.x+=this.vx;
this.y+=this.vy;

this.vy+=this.gravity;

this.draw();

}

}

function spawn(){

fruits.push(new Fruit());

}

setInterval(spawn,800);

let mouse={x:0,y:0};

canvas.addEventListener("mousemove",slash);
canvas.addEventListener("touchmove",(e)=>{
slash(e.touches[0]);
});

function slash(e){

mouse.x=e.clientX;
mouse.y=e.clientY;

ctx.beginPath();
ctx.strokeStyle="white";
ctx.lineWidth=5;
ctx.moveTo(mouse.x-30,mouse.y-30);
ctx.lineTo(mouse.x+30,mouse.y+30);
ctx.stroke();

for(let i=fruits.length-1;i>=0;i--){

let f=fruits[i];

let dx=f.x-mouse.x;
let dy=f.y-mouse.y;

let jarak=Math.sqrt(dx*dx+dy*dy);

if(jarak<35){

if(f.emoji=="💣"){

life--;

}else{

score+=f.value;

if(score>level*150){

level++;

}

}

fruits.splice(i,1);

}

}

}

function game(){

ctx.clearRect(0,0,canvas.width,canvas.height);

for(let i=fruits.length-1;i>=0;i--){

fruits[i].update();

if(fruits[i].y>canvas.height+60){

if(fruits[i].emoji!="💣"){

life--;

}

fruits.splice(i,1);

}

}

document.getElementById("score").innerHTML=score;
document.getElementById("life").innerHTML=life;
document.getElementById("level").innerHTML=level;

if(life<=0){

ctx.fillStyle="red";
ctx.font="70px Arial";
ctx.fillText("GAME OVER",canvas.width/2-220,canvas.height/2);

ctx.font="40px Arial";
ctx.fillText("Skor : "+score,canvas.width/2-80,canvas.height/2+60);

return;

}

requestAnimationFrame(game);

}

game();

</script>

</body>
</html>
