<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samurai Fruit</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
background:linear-gradient(#6ec6ff,#87ce6f);
font-family:Arial,sans-serif;
}

canvas{
display:block;
}

/* Logo */
#logo{
position:absolute;
top:15px;
left:15px;
width:80px;
height:80px;
object-fit:contain;
z-index:100;
}

/* Skor */
#ui{
position:absolute;
top:25px;
left:110px;
color:white;
font-size:28px;
font-weight:bold;
text-shadow:2px 2px 5px black;
}

/* Nyawa */
#life{
position:absolute;
top:15px;
right:20px;
color:white;
font-size:28px;
text-shadow:2px 2px 5px black;
}
</style>

</head>
<body>

<!-- Logo -->
<img id="logo" src="logo.png" alt="Logo Game">

<div id="ui">Skor : 0</div>
<div id="life">❤️❤️❤️</div>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;

window.onresize=()=>{
canvas.width=innerWidth;
canvas.height=innerHeight;
};

const buah=[
"🍎","🍊","🍉","🍌","🍇",
"🍍","🥝","🍓","🥥","🥭",
"🍐","🍒"
];

let score=0;
let life=3;
let objects=[];
let slash=[];

function spawn(){

const bomb=Math.random()<0.15;

objects.push({

x:Math.random()*canvas.width,
y:canvas.height+50,

vx:(Math.random()-0.5)*8,
vy:-18-Math.random()*6,

r:35,

fruit:bomb?"💣":buah[Math.floor(Math.random()*buah.length)],

bomb:bomb

});

}

setInterval(spawn,600);

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);

objects.forEach((o,i)=>{

o.x+=o.vx;
o.y+=o.vy;
o.vy+=0.35;

ctx.font=(o.r*2)+"px serif";
ctx.textAlign="center";
ctx.fillText(o.fruit,o.x,o.y);

if(o.y>canvas.height+80){

if(!o.bomb){

life--;
document.getElementById("life").innerHTML="❤️".repeat(life);

if(life<=0){

alert("GAME OVER\nSkor : "+score);
location.reload();

}

}

objects.splice(i,1);

}

});

ctx.beginPath();

slash.forEach((p,i)=>{

if(i==0)
ctx.moveTo(p.x,p.y);
else
ctx.lineTo(p.x,p.y);

});

ctx.strokeStyle="white";
ctx.lineWidth=6;
ctx.stroke();

requestAnimationFrame(draw);

}

draw();

function hit(x,y){

slash.push({x,y});

if(slash.length>20)
slash.shift();

objects.forEach((o,i)=>{

const dx=o.x-x;
const dy=o.y-y;

if(Math.sqrt(dx*dx+dy*dy)<o.r){

if(o.bomb){

alert("💥 BOOM!\nGame Selesai");
location.reload();

}else{

score++;

document.getElementById("ui").innerHTML="Skor : "+score;

objects.splice(i,1);

}

}

});

}

canvas.addEventListener("mousemove",e=>{

hit(e.clientX,e.clientY);

});

canvas.addEventListener("touchmove",e=>{

e.preventDefault();

const t=e.touches[0];

hit(t.clientX,t.clientY);

});

</script>

</body>
</html>
