<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAN Samurai Fruit</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:linear-gradient(#6ec6ff,#7ddc7d);
}

canvas{
    display:block;
}

/* UI */
#ui{
    position:absolute;
    top:20px;
    left:20px;
    color:#fff;
    font-size:28px;
    font-weight:bold;
    text-shadow:2px 2px 5px #000;
    z-index:10;
}

/* 5 Logo kanan atas */
#logoBar{
    position:absolute;
    top:15px;
    right:15px;
    display:flex;
    gap:10px;
    z-index:20;
}

.logo{
    width:55px;
    height:55px;
    border-radius:50%;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    box-shadow:0 0 10px rgba(0,0,0,.5);
    transition:.3s;
}

.logo:hover{
    transform:scale(1.15) rotate(10deg);
}
</style>

</head>
<body>

<div id="ui">
Skor : <span id="score">0</span><br>
❤️ Nyawa : <span id="life">3</span>
</div>

<div id="logoBar">
<div class="logo">⚔️</div>
<div class="logo">🍉</div>
<div class="logo">🍎</div>
<div class="logo">🥝</div>
<div class="logo">🔥</div>
</div>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
}
resize();
window.onresize=resize;

let score=0;
let life=3;

const fruits=[];

const icons=[
"🍎","🍉","🍊","🍓","🍌","🥝","🍍","🍒"
];

function spawn(){

let bomb=Math.random()<0.20;

fruits.push({

x:Math.random()*canvas.width,
y:canvas.height+50,
vx:(Math.random()-0.5)*8,
vy:-14-Math.random()*5,
g:0.25,
size:60,
bomb:bomb,
emoji:bomb?"💣":icons[Math.floor(Math.random()*icons.length)]

});

}

setInterval(spawn,700);

function update(){

ctx.clearRect(0,0,canvas.width,canvas.height);

for(let i=fruits.length-1;i>=0;i--){

let f=fruits[i];

f.x+=f.vx;
f.y+=f.vy;
f.vy+=f.g;

ctx.font=f.size+"px serif";
ctx.fillText(f.emoji,f.x,f.y);

if(f.y>canvas.height+100){

if(!f.bomb){
life--;
document.getElementById("life").innerHTML=life;

if(life<=0){
alert("GAME OVER\nSkor : "+score);
location.reload();
}
}

fruits.splice(i,1);

}

}

requestAnimationFrame(update);

}

update();

const trail=[];

function slice(x,y){

trail.push({x,y});

if(trail.length>15)
trail.shift();

ctx.beginPath();

for(let i=0;i<trail.length;i++){

if(i==0)
ctx.moveTo(trail[i].x,trail[i].y);
else
ctx.lineTo(trail[i].x,trail[i].y);

}

ctx.strokeStyle="white";
ctx.lineWidth=6;
ctx.stroke();

for(let i=fruits.length-1;i>=0;i--){

let f=fruits[i];

let dx=x-f.x;
let dy=y-f.y;

if(Math.sqrt(dx*dx+dy*dy)<45){

if(f.bomb){

life--;
document.getElementById("life").innerHTML=life;

if(life<=0){

alert("GAME OVER\nSkor : "+score);
location.reload();

}

}else{

score++;
document.getElementById("score").innerHTML=score;

}

fruits.splice(i,1);

}

}

}

canvas.addEventListener("mousemove",e=>{

slice(e.clientX,e.clientY);

});

canvas.addEventListener("touchmove",e=>{

slice(e.touches[0].clientX,e.touches[0].clientY);

e.preventDefault();

});

</script>

</body>
</html>
