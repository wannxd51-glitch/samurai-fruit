<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAN Samurai Fruit</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:linear-gradient(#69c6ff,#7bd86b);
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

/* Logo kanan atas */
#logo{
    position:absolute;
    top:15px;
    right:15px;
    width:90px;
    height:90px;
    border-radius:50%;
    border:3px solid white;
    box-shadow:0 0 15px black;
    z-index:100;
    background:white;
    object-fit:cover;
}

/* Skor */
#score{
    position:absolute;
    top:20px;
    left:20px;
    color:white;
    font-size:32px;
    font-weight:bold;
    text-shadow:2px 2px 5px black;
}
</style>
</head>

<body>

<div id="score">Score : 0</div>
<div id="topBar">

    <img src=" IMG-20260728-WA0041.jpg"class="logo">
    <img src="IMG-20260728-WA0042.jpg" class="logo">
    <img src="IMG-20260728-WA0043.jpg" class="logo">
    <img src="IMG-20260728-WA0044.jpg" class="logo">
    <img src="logo5.png" class="logo">

</div>

<div id="score">Score : 0</div>

<canvas id="game"></canvas>


<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

let score=0;
let fruits=[];

const emojis=["🍎","🍉","🍌","🍍","🍓","🥝","🍊",""];

function Fruit(){

    this.x=Math.random()*canvas.width;
    this.y=canvas.height+50;

    this.vx=(Math.random()-0.5)*8;
    this.vy=-18-Math.random()*5;

    this.size=50;

    this.emoji=emojis[Math.floor(Math.random()*emojis.length)];

}

function spawnFruit(){
    fruits.push(new Fruit());
}

setInterval(spawnFruit,800);

canvas.addEventListener("mousemove",cutFruit);
canvas.addEventListener("touchmove",function(e){
    cutFruit(e.touches[0]);
});

function cutFruit(e){

    for(let i=fruits.length-1;i>=0;i--){

        let f=fruits[i];

        let dx=e.clientX-f.x;
        let dy=e.clientY-f.y;

        if(Math.sqrt(dx*dx+dy*dy)<40){

            fruits.splice(i,1);
            score++;
            document.getElementById("score").innerHTML="Score : "+score;

        }
    }
}

function game(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.font="50px Arial";

    for(let i=fruits.length-1;i>=0;i--){

        let f=fruits[i];

        f.x+=f.vx;
        f.y+=f.vy;
        f.vy+=0.35;

        ctx.fillText(f.emoji,f.x,f.y);

        if(f.y>canvas.height+100){
            fruits.splice(i,1);
        }

    }

    requestAnimationFrame(game);
}

game();

</script>

</body>
</html>
