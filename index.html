<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samurai Fruit</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
background:#111;
font-family:Arial;
}

canvas{
display:block;
background:linear-gradient(#4ea5ff,#8fd3ff,#6dbb55);
}

#ui{
position:absolute;
top:10px;
left:10px;
color:white;
font-size:22px;
font-weight:bold;
text-shadow:2px 2px 5px black;
}

#title{
position:absolute;
width:100%;
top:20px;
text-align:center;
font-size:40px;
color:#fff;
font-weight:bold;
text-shadow:0 0 20px red;
}
</style>

</head>
<body>

<div id="title">⚔️ SAMURAI FRUIT ⚔️</div>

<div id="ui">
Score :
<span id="score">0</span>

<br>

Level :
<span id="level">1</span>

<br>

Life :
<span id="life">3</span>

</div>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let score=0;
let level=1;
let life=3;

const fruits=[];

function Fruit(){

this.x=Math.random()*canvas.width;

this.y=canvas.height+50;

this.r=30;

this.speed=4+Math.random()*3+level;

this.type=Math.random()<0.15?"bomb":"fruit";

this.color=this.type=="bomb"?"black":"hsl("+Math.random()*360+",80%,50%)";

}

function spawn(){

fruits.push(new Fruit());

}

setInterval(spawn,700);

function update(){

ctx.clearRect(0,0,canvas.width,canvas.height);

for(let i=fruits.length-1;i>=0;i--){

let f=fruits[i];

f.y-=f.speed;

ctx.beginPath();

ctx.arc(f.x,f.y,f.r,0,Math.PI*2);

ctx.fillStyle=f.color;

ctx.fill();

if(f.type=="bomb"){

ctx.fillStyle="white";

ctx.fillText("💣",f.x-12,f.y+8);

}else{

ctx.fillStyle="white";

ctx.fillText("🍉",f.x-15,f.y+8);

}

if(f.y<-50){

if(f.type=="fruit"){

life--;

document.getElementById("life").innerText=life;

}

fruits.splice(i,1);

}

}

document.getElementById("score").innerText=score;

document.getElementById("level").innerText=level;

if(score>0 && score%10==0){

level=1+Math.floor(score/10);

}

if(life<=0){

alert("Game Over\nScore : "+score);

location.reload();

}

requestAnimationFrame(update);

}

update();

function slash(x,y){

for(let i=fruits.length-1;i>=0;i--){

let f=fruits[i];

let dx=x-f.x;

let dy=y-f.y;

let d=Math.sqrt(dx*dx+dy*dy);

if(d<f.r){

if(f.type=="bomb"){

life--;

}else{

score++;

}

fruits.splice(i,1);

}

}

}

canvas.addEventListener("mousemove",(e)=>{

if(e.buttons==1){

slash(e.clientX,e.clientY);

}

});

canvas.addEventListener("touchmove",(e)=>{

const t=e.touches[0];

slash(t.clientX,t.clientY);

});

</script>

</body>
</html>
