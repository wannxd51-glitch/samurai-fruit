<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAN Samurai Buah</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:linear-gradient(#6ec6ff,#8bc34a);
}

canvas{
    display:block;
}

/* ===== 5 Logo di kanan atas ===== */
#logoBar{
    position:absolute;
    top:10px;
    right:10px;
    display:flex;
    gap:8px;
    z-index:100;
}

#logoBar img{
    width:55px;
    height:55px;
    border-radius:50%;
    border:2px solid white;
    background:white;
    object-fit:cover;
    box-shadow:0 0 10px rgba(0,0,0,.5);
}

/* ===== Skor ===== */
#score{
    position:absolute;
    top:15px;
    left:15px;
    color:white;
    font-size:32px;
    font-weight:bold;
    text-shadow:2px 2px 5px black;
}
</style>
</head>

<body>

<div id="score">Score : 0</div>

<div id="logoBar">
    <img src="wan.png" alt="WAN">
    <img src="rpl.jpg" alt="RPL">
    <img src="moko.jpg" alt="MOKO">
    <img src="school.jpg" alt="School">
    <img src="samurai.png" alt="Samurai">
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
resize();
addEventListener("resize",resize);

let score=0;
let gameOver=false;
let fruits=[];

const objek=[
"🍎","🍉","🍌","🍍","🍓","🥝","🍊","🥭","🍇"
];

function Fruit(){

    this.x=Math.random()*canvas.width;
    this.y=canvas.height+50;

    this.vx=(Math.random()-0.5)*8;
    this.vy=-18-Math.random()*6;

    this.size=55;

    if(Math.random()<0.15){
        this.emoji="💣";
    }else{
        this.emoji=objek[Math.floor(Math.random()*objek.length)];
    }

}

function spawnFruit(){

    if(!gameOver)
        fruits.push(new Fruit());

}

setInterval(spawnFruit,700);

function slash(e){

    if(gameOver) return;

    let x=e.clientX;
    let y=e.clientY;

    for(let i=fruits.length-1;i>=0;i--){

        let f=fruits[i];

        let dx=x-f.x;
        let dy=y-f.y;

        if(Math.sqrt(dx*dx+dy*dy)<45){

            if(f.emoji=="💣"){

                gameOver=true;

                setTimeout(()=>{

                    alert("💣 BOOM!\nGame Over\nScore : "+score);

                    score=0;
                    fruits=[];
                    gameOver=false;

                    document.getElementById("score").innerHTML="Score : 0";

                },100);

                return;
            }

            fruits.splice(i,1);

            score++;

            document.getElementById("score").innerHTML="Score : "+score;

        }

    }

}

canvas.addEventListener("mousemove",slash);

canvas.addEventListener("touchmove",function(e){
    slash(e.touches[0]);
});

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.font="55px Arial";

    for(let i=fruits.length-1;i>=0;i--){

        let f=fruits[i];

        f.x+=f.vx;
        f.y+=f.vy;
        f.vy+=0.35;

        ctx.fillText(f.emoji,f.x,f.y);

        if(f.y>canvas.height+80){

            fruits.splice(i,1);

        }

    }

    requestAnimationFrame(draw);

}

draw();
</script>

</body>
</html>
