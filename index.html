<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WAN Samurai Fruit</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:linear-gradient(#66c2ff,#b7ff90);
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#logoBar{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:15px;
    z-index:10;
}

.logo{
    width:70px;
    height:70px;
    border-radius:50%;
    background:white;
    border:3px solid gold;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:30px;
    box-shadow:0 0 15px black;
}
</style>
</head>

<body>

<div id="logoBar">

<div class="logo">⚔️</div>
<div class="logo">🍉</div>
<div class="logo">🍎</div>
<div class="logo">🍍</div>
<div class="logo">WAN</div>

</div>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
}
resize();
window.onresize=resize;

let fruits=[];

function Fruit(){

this.x=Math.random()*canvas.width;
this.y=canvas.height+50;

this.vx=(Math.random()-0.5)*8;
this.vy=-15-Math.random()*10;

this.r=35;

this.emoji=["🍎","🍉","🍍","🍌","🍓","🥝"][Math.floor(Math.random()*6)];

}

function spawn(){
fruits.push(new Fruit());
}

setInterval(spawn,900);

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.font="50px Arial";

for(let i=fruits.length-1;i>=0;i--){

let f=fruits[i];

f.x+=f.vx;
f.y+=f.vy;
f.vy+=0.35;

ctx.fillText(f.emoji,f.x,f.y);

if(f.y>canvas.height+100){
fruits.splice(i,1);
}

}

requestAnimationFrame(draw);

}

draw();

</script>

</body>
</html>
