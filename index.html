<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Samurai Fruit</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
overflow:hidden;
background:#111;
}

canvas{
display:block;
background:url("assets/background.jpg") center/cover no-repeat;
}

#hud{
position:absolute;
top:15px;
left:15px;
color:white;
font-size:22px;
font-weight:bold;
text-shadow:2px 2px 5px black;
}

#logo{
position:absolute;
top:10px;
width:100%;
text-align:center;
font-size:40px;
font-weight:bold;
color:white;
text-shadow:0 0 20px red;
}

</style>

</head>

<body>

<div id="logo">
⚔️ SAMURAI FRUIT ⚔️
</div>

<div id="hud">

Score :
<span id="score">0</span>

<br>

Level :
<span id="level">1</span>

<br>

Life :
<span id="life">3</span>

</div>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;

let score=0;
let level=1;
let life=3;

let slash=[];

const apple=new Image();
apple.src="assets/apple.png";

const orange=new Image();
orange.src="assets/orange.png";

const watermelon=new Image();
watermelon.src="assets/watermelon.png";

const bomb=new Image();
bomb.src="assets/bomb.png";

const fruitImage=[apple,orange,watermelon];

const fruits=[];

class Fruit{

constructor(){

this.image=Math.random()<0.15?bomb:
fruitImage[Math.floor(Math.random()*fruitImage.length)];

this.x=Math.random()*canvas.width;

this.y=canvas.height+80;

this.size=80;

this.vx=(Math.random()-0.5)*4;

this.vy=-(10+Math.random()*4+level);

this.gravity=.20;

this.rotate=Math.random()*360;

this.spin=(Math.random()-0.5)*4;

}

draw(){

ctx.save();

ctx.translate(this.x,this.y);

ctx.rotate(this.rotate*Math.PI/180);

ctx.drawImage(this.image,-40,-40,this.size,this.size);

ctx.restore();

}

update(){

this.x+=this.vx;

this.y+=this.vy;

this.vy+=this.gravity;

this.rotate+=this.spin;

}

}

function spawn(){

fruits.push(new Fruit());

}

setInterval(spawn,900);

function loop(){

ctx.clearRect(0,0,canvas.width,canvas.height);

for(let i=fruits.length-1;i>=0;i--){

let f=fruits[i];

f.update();

f.draw();

if(f.y>canvas.height+100){

if(f.image!==bomb){

life--;

}

fruits.splice(i,1);

}

}

ctx.strokeStyle="rgba(255,255,255,.7)";
ctx.lineWidth=8;
ctx.beginPath();

for(let p of slash){

ctx.lineTo(p.x,p.y);

}

ctx.stroke();

if(slash.length>15){

slash.shift();

}

document.getElementById("score").innerHTML=score;

document.getElementById("life").innerHTML=life;

document.getElementById("level").innerHTML=level;

if(score>0 && score%10==0){

level=1+Math.floor(score/10);

}

if(life<=0){

alert("GAME OVER\nScore : "+score);

location.reload();

}

requestAnimationFrame(loop);

}

loop();

function hit(x,y){

slash.push({x,y});

for(let i=fruits.length-1;i>=0;i--){

let f=fruits[i];

let dx=x-f.x;

let dy=y-f.y;

let d=Math.sqrt(dx*dx+dy*dy);

if(d<40){

if(f.image===bomb){

life--;

}else{

score++;

createParticles(f.x,f.y);

}

fruits.splice(i,1);

}

}

}

canvas.onmousemove=e=>{

if(e.buttons){

hit(e.clientX,e.clientY);

}

}

canvas.ontouchmove=e=>{

let t=e.touches[0];

hit(t.clientX,t.clientY);

}

const particles=[];

function createParticles(x,y){

for(let i=0;i<25;i++){

particles.push({

x:x,

y:y,

vx:(Math.random()-.5)*8,

vy:(Math.random()-.5)*8,

life:40

});

}

}

setInterval(()=>{

for(let i=particles.length-1;i>=0;i--){

let p=particles[i];

ctx.fillStyle="red";

ctx.beginPath();

ctx.arc(p.x,p.y,3,0,6.28);

ctx.fill();

p.x+=p.vx;

p.y+=p.vy;

p.life--;

if(p.life<0){

particles.splice(i,1);

}

}

},16);

</script>

</body>

</html>
